<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Average rent burden across covered ZIPs, by occupation</title>
<desc id="desc">Average annual whole-home rent divided by one worker’s gross annual pay, across ZIPs. Nine occupations meet the data-quality thresholds.</desc>
